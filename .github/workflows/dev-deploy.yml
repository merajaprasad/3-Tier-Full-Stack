name: Dev Deploy to ECS

on:
  push:
    branches:
      - dev
    paths:
      - '**'
      - '.github/workflows/dev-deploy.yml'
      - 'Dockerfile.main'
  workflow_dispatch:

concurrency:
  group: deploy-yelp-camp-dev
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ACCOUNT_ID: "075810104695"
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::075810104695:role/github-action-yelp-camp-dev-deploy-oidc-role

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-24.04
    environment: dev

    steps:
      - name: Initialize Pipeline
        run: echo "pipeline started"

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Gitleaks Secret Scan
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          /tmp/gitleaks detect --source . --redact --exit-code 0 --verbose

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-yelp-camp-dev-${{ github.run_id }}









