name: yelp camp deploy into ECS

on:
  push:
    branches:
      - dev
    paths:
      - '**'
      - '.github/workflows/dev-deploy.yml'
  workflow_dispatch:

concurrency:
  group: yelp-camp-deploy-dev
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read  

env:
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::075810104695:role/github-action-yelp-camp-dev-deploy-oidc-role
  AWS_REGION: ap-south-1
  DOCKERFILE_PATH: Dockerfile.main


jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-24.04
    environment: dev

    steps:
      - name: Initialize Pipeline
        run: echo "Pipeline Started"
      
      - name: Checkout Repository
        uses: actions/checkout@v5
      
      - name: GitLeaks Secret Scan
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          /tmp/gitleaks detect --source . --redact --exit-code 0 --verbose

      - name: Configure Aws Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: yelp-camp-deploy-${{ github.run_id }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Images
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          docker build --load -f "${{ env.DOCKERFILE_PATH }}" -t "yelp-camp-${BUILD_NUMBER}" .
          docker images

      





