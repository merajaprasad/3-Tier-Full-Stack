name: yelp camp deploy into ECS

on:
  push:
    branches:
      - dev
    paths:
      - '**'
      - '.github/workflows/dev-deploy.yml'
  workflow_dispatch:

concurrency:
  group: yelp-camp-deploy-dev
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read  

env:




jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-24.02
    environment: dev

  steps:
    - name: Initialize Pipeline
      run: echo "Pipeline Started"
    
    - name: Checkout Repository
      uses: actions/checkout@v5




